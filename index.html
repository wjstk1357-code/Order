<script>
window.storage = {
  get: async function (key) {
    var v = localStorage.getItem(key);
    if (v === null) throw new Error("저장된 값 없음: " + key);
    return { key: key, value: v };
  },
  set: async function (key, value) {
    localStorage.setItem(key, value);
    return { key: key, value: value };
  },
  "delete": async function (key) {
    localStorage.removeItem(key);
    return { key: key, deleted: true };
  },
  list: async function (prefix) {
    var out = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!prefix || k.indexOf(prefix) === 0) out.push(k);
    }
    return { keys: out };
  }
};
window.addEventListener("error", function (e) {
  var el = document.getElementById("boot");
  if (el) el.innerHTML = "앱을 여는 중 문제가 생겼습니다.<br /><br />" + (e.message || "");
});

  // SEED 를 만들 때도 불리므로 아래쪽 num 을 쓰지 않고 자체 변환을 씁니다
  const n0 = (v) => (v === "" || v == null ? 0 : parseFloat(v) || 0);
  const ps = prods.slice(), rs = rec.slice();
  ps.forEach((p, pi) => {
    if (p.mode !== "week" || n0(p.every) > 0) return;
    const idx = [];
    rs.forEach((r, ri) => { if (r.p === p.n) idx.push(ri); });
    if (idx.length !== 1) return;
    const r = rs[idx[0]];
    if (r.u !== "g") return;
    const wk = n0(p.wk), amt = n0(r.amt);
    if (!(wk >= 50 && amt > 0 && amt <= 1)) return;
    ps[pi] = { ...p, wk: amt };
    rs[idx[0]] = { ...r, amt: wk };
  });
  return { prods: ps, rec: rs };
}

// 새로 설치하거나 껍데기를 넘겨받은 사람이 깨진 값을 받지 않도록 여기서 한 번 걸러 둡니다.
const SEED = (() => {
  const f = fixSwapped(SEED0.prods, SEED0.rec);
  return { ...SEED0, prods: f.prods, rec: f.rec };
})();

// 새 매장용 껍데기 — 단과자와 발효종만 남기고 나머지 배합·제품·품목을 비웁니다.
// 세 매장이 공통으로 치는 게 단과자뿐이라, 나머지는 각자 넣는 게 맞습니다.
const KEEP_PRODS = ["단과자", "발효종"];
function makeShell(m, shopName) {
  const prods = m.prods.filter((p) => KEEP_PRODS.includes(p.n));
  const rec = m.rec.filter((r) => KEEP_PRODS.includes(r.p));
  const used = new Set(rec.map((r) => r.m));
  const items = m.items
    .filter((i) => used.has(i.n))
    // 거래처는 매장마다 다릅니다. 이름만 남으면 발주 탭에 없는 거래처가 뜹니다.
    .map((i) => ({ ...i, stock0: 0, memo: i.memo || "", v: "" }));
  // 달력 제품이 지워진 제품을 가리키면 달력에 넣은 kg이 아무 데도 안 갑니다
  const cal = prods.some((p) => p.n === m.calProd) ? m.calProd : (prods[0] && prods[0].n) || "단과자";
  return {
    v: MASTER_V, shop: shopName || "새 매장", calProd: cal,
    prods, rec, items, eyes: [], vendors: [],
  };
}

// 이미 쓰던 앱의 저장 데이터를 새 형식으로 올려 줍니다.
// 사용자가 고친 값은 건드리지 않고, 없는 것만 채웁니다.
function upgrade(m, plan) {
  if (!m || !m.items || !m.prods || !m.rec) return SEED;
  if (m.v === MASTER_V) return m;

  const fix = PLAN_MIGRATE(plan);
  const old = !(m.v >= 8);
  const prods = m.prods.map((p) => {
    let x = p;
    // v7 — 팥·생크림 전용 카드를 없애고 보통 제품으로 옮깁니다
    if (fix[x.n] && !x.moved) x = { ...x, ...fix[x.n], moved: 1 };
    // v8 — 생산량 단위 이름을 붙이고, 부추빵 속을 '주 3회'로 고칩니다
    if (old && UNIT_FIX[x.n] && !x.unit) x = { ...x, unit: UNIT_FIX[x.n] };
    if (old && x.n === "부추빵 속") x = { ...x, mode: "week", wk: 3, unit: "회" };
    if (x.mode) return x;
    const wk = WEEKLY[x.n];
    // 사용자가 평일/주말을 다르게 고쳐놨으면 그대로 둡니다
    if (wk !== undefined && x.wd === x.we) return { ...x, mode: "week", wk };
    return { ...x, mode: "day" };
  });
  ADD_PRODS.forEach((np) => { if (!prods.some((p) => p.n === np.n)) prods.push({ ...np }); });

  const items = m.items.map((i) => {
    let x = i;
    if (x.box === undefined) {
      const b = BOX[x.n];
      // 예전 '묶음 발주(lot)'는 박스와 같은 뜻이라 그대로 옮깁니다
      const box = x.lot && x.lot > 1 ? x.lot : (b ? b.box : 1);
      x = { ...x, box, bu: b ? b.bu : (box > 1 ? "박스" : "") };
    }
    // v6 — 오뗄베이컨을 박스가 아니라 개(35장 한 세트)로 세도록 고칩니다
    if (x.n === "오뗄베이컨" && num(x.spec) === 350) {
      x = { ...x, spec: 35, su: "장", iu: "개", box: 10, bu: "박스" };
    }
    return x;
  });
  ADD_ITEMS.forEach((ni) => { if (!items.some((i) => i.n === ni.n)) items.push(blankItem(ni.n, ni)); });

  const rec = old
    ? m.rec.filter((r) => r.p !== "부추빵 속").concat(BUCHU_REC)
    : m.rec.slice();
  ADD_REC.forEach((nr) => {
    if (!rec.some((r) => r.p === nr.p && r.m === nr.m)) rec.push({ ...nr });
  });
  if (!items.some((i) => i.n === "슬라이스 햄")) {
    items.push(blankItem("슬라이스 햄", { spec: 50, su: "장", iu: "개", chk: 0, memo: "부추빵 속" }));
  }

  // v9 — 생산량 칸과 배합 양 칸이 뒤바뀐 것을 바로잡습니다.
  // 예) 부추빵 속 = 주 2500번 × 마요네즈 1g  →  주 1번 × 마요네즈 2500g
  // 1g짜리 재료는 있을 수 없으므로 확실한 경우에만 바꿉니다.
  // 주간 총량(2500 × 1g = 1 × 2500g)은 그대로라 발주 숫자는 안 바뀝니다.
  // v10 — '몇 주에 한 번'을 없애고 '주 단위' 하나로 합칩니다 (2주에 1번 = 주 0.5번)
  const prods10 = prods.map((p) =>
    (p.mode === "week" && num(p.every) > 0)
      ? { ...p, wk: round2(1 / num(p.every)), every: 0 }
      : p);

  // v9 — 생산량과 배합 양이 뒤바뀐 것 바로잡기 (주간 총량은 그대로 → 발주 숫자 안 바뀜)
  const fixed = fixSwapped(prods10, rec);
  const prods9 = fixed.prods, rec9 = fixed.rec;

  return { ...m, v: MASTER_V, shop: m.shop || SEED.shop, calProd: m.calProd || "단과자", prods: prods9, items, rec: rec9, eyes: m.eyes || SEED.eyes };
}

// 붙여넣은 배합 글을 읽어냅니다.
// 예: 소보루 피 1배합 // 원당 600g, 중력 800g
//
// 재료 하나씩 끊어서 읽습니다. 이름에 숫자가 든 품목("마요네즈 3kg", "T65")이
// 있어서, 먼저 아는 품목 이름과 맞춰보고 남는 뒤쪽을 숫자로 읽습니다.
// 예전에는 "마요네즈 3kg 1800g"을 '마요네즈 3'으로 읽어 조용히 틀린 값이 들어갔습니다.
function parseRecipe(text, known) {
  const raw = String(text || "").trim();
  if (!raw) return null;
  let head = raw, body = "";
  const cut = raw.indexOf("//");
  if (cut > -1) { head = raw.slice(0, cut); body = raw.slice(cut + 2); }
  else {
    const nl = raw.indexOf("\n");
    if (nl > -1) { head = raw.slice(0, nl); body = raw.slice(nl + 1); }
  }
  const name = head.replace(/\s*[\d.]+\s*배합\s*$/, "").replace(/[:：]\s*$/, "").trim();

  // 긴 이름부터 맞춰봅니다 ("마요네즈 3kg"이 "마요네즈"보다 먼저 걸리도록)
  const list = (known || []).slice().sort((a, b) => (b.n || "").length - (a.n || "").length);
  const suOf = {};
  (known || []).forEach((i) => { suOf[i.n] = i.su; });

  const tail = /([\d]+(?:\.[\d]+)?)\s*(kg|g|개|장|캔|통|병|포대|박스|봉|팩)?\s*$/;
  const lines = [];
  String(body).split(/[,\n·;]+/).forEach((chunk) => {
    let t = String(chunk).replace(/^[\s\-+]+|[\s\-+]+$/g, "");
    if (!t) return;
    let mat = "";
    for (let k = 0; k < list.length; k++) {
      const nm = list[k].n;
      if (nm && t.slice(0, nm.length) === nm) { mat = nm; t = t.slice(nm.length); break; }
    }
    t = t.trim();
    const mt = tail.exec(t);
    if (!mt) return;
    if (!mat) mat = t.slice(0, mt.index).replace(/[\s:：]+$/, "").trim();
    if (!mat) return;
    let amt = parseFloat(mt[1]);
    let u = mt[2] || "";
    const noUnit = !u;
    if (u === "kg") { amt = round2(amt * 1000); u = "g"; }
    else if (!u) {
      // 단위를 안 적었으면 품목의 낱개 단위를 봅니다. 모르면 g로 둡니다.
      const su = suOf[mat];
      u = (su && su !== "kg" && su !== "g") ? "개" : "g";
    }
    else if (u !== "g") u = "개";
    lines.push({ m: mat, amt, u, noUnit });
  });
  return { name, lines };
}

// 발주일 다음 영업일부터 그 다음 발주일까지가 이번 회차가 책임지는 날입니다.
// 예) 월요일이 고정 휴무일 때, 일요일 발주 → 화·수
// 고정 휴무는 아예 건너뜁니다 (openDays 에 없는 요일은 순회에서 빠집니다).
function coverFor(day, orderDays, openDays) {
  const week = openDays && openDays.length ? openDays : OPEN_DEFAULT;
  const od = (orderDays || []).filter((d) => week.includes(d));
  const start = week.indexOf(day);
  if (start < 0) return week.slice();
  const out = [];
  for (let k = 1; k <= week.length; k++) {
    const d = week[(start + k) % week.length];
    out.push(d);
    if (od.includes(d)) break;
  }
  return out;
}

const WD_KEY = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const WD_HEAD = ["일", "월", "화", "수", "목", "금", "토"];
const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseYmd = (s) => { const p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };

// 오늘부터 앞으로 가면서 이번 회차가 책임지는 실제 날짜를 찾습니다.
// 첫 날은 오늘도 포함합니다 (일요일 저녁에 넣어도, 화요일에 열어도 맞게)
function coverDates(today, coverKeys) {
  const out = [];
  let cur = today, first = true;
  coverKeys.forEach((k) => {
    for (let i = first ? 0 : 1; i <= 7; i++) {
      const d = addDays(cur, i);
      if (WD_KEY[d.getDay()] === k) { out.push(d); cur = d; first = false; break; }
    }
  });
  return out;
}

const round2 = (n) => Math.round(n * 100) / 100;
const num = (v) => (v === "" || v === null || v === undefined ? 0 : parseFloat(v) || 0);
function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return "0";
  return String(Math.round(n * 100) / 100);
}
// 배합 한 줄이 일주일에 얼마나 나가는지 — g는 1kg 넘으면 kg으로 보여줍니다.
// g가 아닌 것은 품목의 낱개 단위(장·캔·개…)를 그대로 붙입니다.
// 예전에는 무조건 '개'라 머핀컵 48장이 '48개'로 보였습니다.
function amtText(v, u, su) {
  if (!v) return "0";
  if (u === "g") return v >= 1000 ? fmt(v / 1000) + "kg" : fmt(v) + "g";
  return fmt(v) + (su || "개");
}

function stepFor(v) {
  if (v >= 20) return 5;
  if (v >= 2) return 1;
  return 0.1;
}
// "이번 6.9 + 안전 5 − 재고 11 = 0.9" 형태로 발주 근거를 그대로 보여줍니다
function basis(r) {
  const parts = ["이번 " + fmt(r.needU)];
  if (r.extra) parts.push("미반영 " + r.extra);
  if (r.safe) parts.push("안전 " + r.safe);
  return parts.join(" + ") + " − 재고 " + fmt(r.have) + " = " + fmt(round2(r.short));
}

// ── 작은 부품들 ────────────────────────────────────────────────
function Stepper({ value, onChange, step = 1, size = "md" }) {
  const [draft, setDraft] = useState(null);
  const shown = draft === null ? String(value ?? "") : draft;
  const h = size === "lg" ? 44 : 34;
  const btn = {
    width: h, height: h, background: C.raised, color: C.flour, border: "none",
    borderRadius: 9, fontSize: size === "lg" ? 22 : 17, fontWeight: 600,
    cursor: "pointer", lineHeight: 1, flexShrink: 0, fontFamily: FONT,
  };
  return (
    <div className="flex items-center" style={{ gap: 5 }}>
      <button style={btn} onClick={() => onChange(Math.max(0, round2(value - step)))} aria-label="줄이기">−</button>
      <input
        value={shown} inputMode="decimal"
        onFocus={(e) => { setDraft(String(value ?? "")); setTimeout(() => e.target.select(), 0); }}
        onChange={(e) => {
          const t = e.target.value.replace(/[^0-9.]/g, "");
          setDraft(t);
          onChange(t === "" || t === "." ? 0 : num(t));
        }}
        onBlur={() => setDraft(null)}
        style={{
          width: size === "lg" ? 72 : 56, height: h, textAlign: "center",
          background: C.ink, color: C.flour, border: "1px solid " + C.line,
          borderRadius: 9, fontFamily: MONO, fontSize: size === "lg" ? 19 : 15,
          fontWeight: 600, fontVariantNumeric: "tabular-nums",
        }}
      />
      <button style={btn} onClick={() => onChange(round2(value + step))} aria-label="늘리기">+</button>
    </div>
  );
}

const inputBase = {
  background: C.ink, color: C.flour, border: "1px solid " + C.line, borderRadius: 8,
  padding: "7px 9px", fontFamily: MONO, fontSize: 13, minWidth: 0,
};

function Field({ label, children, w }) {
  return (
    <div style={{ flex: w || 1, minWidth: 0 }}>
      <div style={{ fontSize: 10.5, color: C.quiet, marginBottom: 3 }}>{label}</div>
      {children}
    </div>
  );
}
function Num({ value, onChange, ...rest }) {
  // 타이핑하는 동안에는 화면에 친 글자를 그대로 둡니다.
  // 이게 없으면 칸을 비우는 순간 0이 다시 채워져 수정이 안 됩니다.
  const [draft, setDraft] = useState(null);
  const shown = draft === null ? String(value ?? "") : draft;
  return <input value={shown} inputMode="decimal"
    onFocus={(e) => { setDraft(String(value ?? "")); setTimeout(() => e.target.select(), 0); }}
    onChange={(e) => {
      const t = e.target.value.replace(/[^0-9.]/g, "");
      setDraft(t);
      onChange(t === "" || t === "." ? 0 : num(t));
    }}
    onBlur={() => setDraft(null)}
    style={{ ...inputBase, width: "100%", textAlign: "right" }} {...rest} />;
}
function Txt({ value, onChange, placeholder, list }) {
  // 치는 동안에는 화면 글자만 바꾸고, 칸에서 손을 뗄 때 한 번만 저장합니다.
  // 글자마다 저장하면 목록이 다시 그려지면서 한글이 한 글자씩 끊깁니다.
  const [draft, setDraft] = useState(null);
  const shown = draft === null ? (value || "") : draft;
  const commit = () => {
    if (draft !== null && draft !== (value || "")) onChange(draft);
    setDraft(null);
  };
  return <input value={shown} list={list} placeholder={placeholder}
    onChange={(e) => setDraft(e.target.value)}
    onBlur={commit}
    onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
    style={{ ...inputBase, width: "100%", fontFamily: FONT }} />;
}
function Pill({ on, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      padding: "6px 11px", borderRadius: 999, fontSize: 12, fontWeight: 600, cursor: "pointer",
      background: on ? C.butter : "transparent", color: on ? C.ink : C.muted,
      border: "1px solid " + (on ? C.butter : C.line), fontFamily: FONT,
    }}>{children}</button>
  );
}
function GhostBtn({ onClick, children, danger }) {
  return (
    <button onClick={onClick} style={{
      padding: "8px 12px", borderRadius: 9, background: "transparent",
      color: danger ? C.warn : C.muted, border: "1px solid " + (danger ? C.warn : C.line),
      fontSize: 12, cursor: "pointer", fontFamily: FONT,
    }}>{children}</button>
  );
}

// ── 앱이 멈췄을 때 ────────────────────────────────────────────
// 저장된 값이 한 군데라도 깨지면 예전에는 화면이 하얗게 되고, 그러면 내보내기
// 버튼조차 못 눌러 백업을 뜰 수 없었습니다. 그럴 때 저장된 글자를 그대로 꺼내 보여줍니다.
class Boundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { err: null, raw: "" };
  }
  static getDerivedStateFromError(err) {
    return { err: String((err && err.message) || err) };
  }
  componentDidCatch() {
    try {
      window.storage.get(KEY)
        .then((r) => this.setState({ raw: (r && r.value) || "" }))
        .catch(() => this.setState({ raw: "" }));
    } catch (e) { /* 저장소가 없음 */ }
  }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div style={{ background: C.ink, minHeight: "100vh", fontFamily: FONT, color: C.flour }}>
        <div style={{ maxWidth: 560, margin: "0 auto", padding: "28px 16px 48px" }}>
          <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 10 }}>앱이 멈췄습니다</div>
          <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.7, marginBottom: 16 }}>
            먼저 아래 글자를 통째로 복사해 카톡 '나에게 보내기'에 붙여 두세요.
            지금 저장된 내용 전부입니다. 나중에 불러오기에 붙여넣으면 그대로 돌아옵니다.
          </div>
          <textarea readOnly value={this.state.raw}
            onFocus={(e) => e.target.select()}
            onClick={(e) => e.target.select()}
            style={{
              width: "100%", minHeight: 160, background: C.surface, color: C.muted,
              border: "1px solid " + C.line, borderRadius: 10, padding: 10,
              fontFamily: MONO, fontSize: 11,
            }} />
          <div style={{ fontSize: 11, color: C.quiet, marginTop: 6 }}>
            글자 {String(this.state.raw.length).toLocaleString()}자
          </div>
          <button onClick={() => { try { window.location.reload(); } catch (e) {} }} style={{
            width: "100%", marginTop: 16, padding: "14px", borderRadius: 10, border: "none",
            background: C.butter, color: C.ink, fontSize: 14, fontWeight: 700,
            cursor: "pointer", fontFamily: FONT,
          }}>다시 열기</button>
          <div style={{ fontSize: 10.5, color: C.quiet, fontFamily: MONO, marginTop: 14, lineHeight: 1.6, wordBreak: "break-all" }}>
            {this.state.err}
          </div>
        </div>
      </div>
    );
  }
}

// ── 본체 ───────────────────────────────────────────────────────
function AppInner() {
  const DB_DEFAULT = {
    master: SEED, cycle: "sun", dough: DOUGH_DEFAULT, stock: {},
    plan: PLAN_DEFAULT, sortMode: "cat", orderDays: ORDER_DEFAULT, openDays: OPEN_DEFAULT,
    days: {}, pending: {}, exp: {}, expPrev: {}, diff: {}, expAt: "", filled: true,
  };
  const [db, setDb] = useState(DB_DEFAULT);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("");

  // 처음 열 때 — 새 저장소를 먼저 보고, 없으면 예전 키에서 옮겨옵니다
  useEffect(() => {
    let alive = true;
    (async () => {
      let next = null;
      try {
        const r = await window.storage.get(KEY);
        if (r && r.value) next = JSON.parse(r.value);
      } catch (e) { /* 아직 저장된 게 없음 */ }
      if (!next) {
        const got = {};
        for (const k of Object.keys(OLD_KEYS)) {
          try {
            const r = await window.storage.get(OLD_KEYS[k]);
            if (r && r.value) got[k] = JSON.parse(r.value);
          } catch (e) { /* 그 키는 없음 */ }
        }
        if (Object.keys(got).length) next = got;
      }
      if (!alive) return;
      if (next) setDb((d) => ({ ...d, ...next }));
      setLoaded(true);
    })();
    return () => { alive = false; };
  }, []);

  // 값이 바뀌면 잠깐 기다렸다 한 번만 저장합니다. 실패하면 몇 번 더 시도하고,
  // 그래도 안 되면 이유를 그대로 화면에 보여줍니다.
  const savedRef = React.useRef("");
  const [saveErr, setSaveErr] = useState("");

  const writeNow = async (body) => {
    for (let n = 1; n <= 3; n++) {
      try {
        const r = await window.storage.set(KEY, body);
        if (r) { savedRef.current = body; setSaveState("saved"); setSaveErr(""); return true; }
        setSaveErr("저장소가 빈 응답을 돌려줬습니다 (" + n + "번째)");
      } catch (e) {
        setSaveErr(String((e && e.message) || e));
      }
      await new Promise((ok) => setTimeout(ok, 1200 * n));
    }
    setSaveState("error");
    return false;
  };

  // 전체를 글자로 바꾸는 일이 무거워서(10만 자대) 값이 바뀔 때마다 하면 입력이 끊깁니다.
  // 1.5초 쉬고 나서 한 번만 만듭니다.
  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    const t = setTimeout(() => {
      const body = JSON.stringify(db);
      if (body === savedRef.current) { setSaveState("saved"); return; }
      writeNow(body);
    }, 1500);
    return () => clearTimeout(t);
  }, [db, loaded]);

  const put = (k) => (v) => setDb((d) => ({ ...d, [k]: typeof v === "function" ? v(d[k]) : v }));
  const master = db.master, dough = db.dough, stock = db.stock, plan = db.plan;
  const sortMode = db.sortMode || "cat";
  const setMaster = put("master"), setDough = put("dough"), setStock = put("stock");
  const setPlan = put("plan"), setCycle = put("cycle"), setSortMode = put("sortMode");
  // 고정 휴무 — 여기 없는 요일은 달력에서 '휴'로 잠기고 회차 계산에서 통째로 빠집니다
  const openDays = ALL_WEEK.filter((d) => (db.openDays && db.openDays.length ? db.openDays : OPEN_DEFAULT).includes(d));
  const setOpenDays = put("openDays");
  // 발주일은 영업일 중에서만 고릅니다
  const orderDays0 = db.orderDays && db.orderDays.length ? db.orderDays : ORDER_DEFAULT;
  const orderDays = orderDays0.filter((d) => openDays.includes(d));
  const setOrderDays = put("orderDays");
  const cycle = orderDays.includes(db.cycle) ? db.cycle : orderDays[0];

  const [reorder, setReorder] = useState(false);
  const [dayEdit, setDayEdit] = useState(false);
  const [openEdit, setOpenEdit] = useState(false);
  const [baseEdit, setBaseEdit] = useState(false);
  const [selDate, setSelDate] = useState(null);
  // 폰 앱은 껐다 켜는 게 아니라 화면만 덮어두는 일이 많습니다. 날짜가 고정이면
  // 자정을 넘긴 뒤 회차 날짜가 어제 기준으로 남습니다.
  const [today, setToday] = useState(() => new Date());
  useEffect(() => {
    const tick = () => setToday((d) => (ymd(d) === ymd(new Date()) ? d : new Date()));
    const t = setInterval(tick, 60000);
    document.addEventListener("visibilitychange", tick);
    window.addEventListener("focus", tick);
    return () => {
      clearInterval(t);
      document.removeEventListener("visibilitychange", tick);
      window.removeEventListener("focus", tick);
    };
  }, []);
  const [monthAnchor, setMonthAnchor] = useState(() => new Date(today.getFullYear(), today.getMonth(), 1));

  const days = db.days || {};
  const setDays = put("days");
  const off = db.off || {};
  const isOff = (d) => !!off[ymd(d)];
  const toggleOff = (key) => setDb((x) => {
    const n = { ...(x.off || {}) };
    if (n[key]) delete n[key]; else n[key] = 1;
    return { ...x, off: n };
  });
  // 그 날 친 kg — 쉬는 날은 0, 따로 고친 값이 있으면 그걸, 없으면 요일 기본값.
  // 고정 휴무(openDays 밖)인 요일도 0입니다.
  const kgOf = (d) => {
    const key = ymd(d), wk = WD_KEY[d.getDay()];
    if (off[key]) return 0;
    if (!openDays.includes(wk)) return 0;
    if (days[key] !== undefined) return num(days[key]);
    return num(dough[wk]);
  };
  const [tab, setTab] = useState("stock");
  const [setTabSub, setSetTabSub] = useState("items");
  const [copied, setCopied] = useState("");
  const [stateCopied, setStateCopied] = useState(false);
  const [outOpen, setOutOpen] = useState(false);
  const [pasteOpen, setPasteOpen] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [overwriteFrom, setOverwriteFrom] = useState("");
  const [shellName, setShellName] = useState("유천동");
  const [armed, setArmed] = useState("");
  const [pasteMsg, setPasteMsg] = useState("");
  const [openRow, setOpenRow] = useState(null);
  const [filter, setFilter] = useState("");
  const [recProd, setRecProd] = useState("단과자");
  const [recPasteOpen, setRecPasteOpen] = useState(false);
  const [recText, setRecText] = useState("");
  const [parsed, setParsed] = useState(null);
  const [itemMsg, setItemMsg] = useState("");

  // 예전 형식으로 저장돼 있으면 새 형식으로 올립니다 (고친 값은 그대로 둠)
  useEffect(() => {
    if (!loaded) return;
    if (master && master.v === MASTER_V) return;
    setMaster(upgrade(master, plan));
  }, [loaded]);

  const ready = loaded;
  const cover = coverFor(cycle, orderDays, openDays);

  const toggleOrderDay = (k) => {
    if (!openDays.includes(k)) return; // 쉬는 요일에는 발주를 넣지 않습니다
    const next = orderDays.includes(k)
      ? orderDays.filter((x) => x !== k)
      : openDays.filter((d) => orderDays.includes(d) || d === k);
    if (!next.length) return; // 발주일이 하나도 없으면 계산이 안 됩니다
    setOrderDays(next);
  };

  // 고정 휴무를 바꾸면 그 요일에 걸려 있던 발주일도 같이 정리합니다
  const toggleOpenDay = (k) => {
    const next = openDays.includes(k)
      ? openDays.filter((x) => x !== k)
      : ALL_WEEK.filter((d) => openDays.includes(d) || d === k);
    if (next.length < 2) return;                       // 영업일이 하나뿐이면 회차가 안 돕니다
    const nextOrder = orderDays.filter((d) => next.includes(d));
    if (!nextOrder.length) return;                     // 발주일이 전부 사라지면 막습니다
    setDb((d) => ({ ...d, openDays: next, orderDays: nextOrder }));
  };

  const cycleDates = coverDates(today, cover);
  const openDates = cycleDates.filter((d) => !isOff(d));
  const coverKg = openDates.reduce((a, d) => a + kgOf(d), 0);
  const wdDays = openDates.filter((d) => !WEEKEND.includes(WD_KEY[d.getDay()])).length;
  const weDays = openDates.filter((d) => WEEKEND.includes(WD_KEY[d.getDay()])).length;
  const weekKg = openDays.reduce((a, k) => a + num(dough[k]), 0);
  // 한 주에 평일이 며칠, 주말이 며칠인지 — 예전엔 4일·2일로 박혀 있었습니다
  const wdWeek = openDays.filter((d) => !WEEKEND.includes(d)).length;
  const weWeek = openDays.filter((d) => WEEKEND.includes(d)).length;
  const openCount = openDays.length || 1;
  const calProd = master.calProd || "단과자";

  const items = master.items, prods = master.prods, rec = master.rec;
  const cur = (n) => {
    if (stock[n] !== undefined) return stock[n];
    const it = items.find((x) => x.n === n);
    return it ? (it.stock0 || 0) : 0;
  };

  // 이름은 재고·발주·차이 기록의 키로도 쓰입니다. 바꿀 때 전부 같이 옮기지 않으면
  // 재고가 0으로 돌아가고 기록이 끊깁니다.
  const renameKeys = (o, old, v) => {
    if (!o) return o;
    const out = {};
    Object.keys(o).forEach((k) => { out[k === old ? v : k] = o[k]; });
    return out;
  };
  const renameItem = (old, raw) => {
    const v = String(raw || "").trim();
    if (!v) { setItemMsg("이름은 비울 수 없습니다."); return; }
    if (v === old) return;
    if (items.some((x) => x.n === v)) { setItemMsg("'" + v + "' 품목이 이미 있습니다."); return; }
    setDb((d) => ({
      ...d,
      master: {
        ...d.master,
        items: d.master.items.map((x) => (x.n === old ? { ...x, n: v } : x)),
        rec: d.master.rec.map((r) => (r.m === old ? { ...r, m: v } : r)),
        ord: (d.master.ord || []).map((x) => (x === old ? v : x)),
      },
      stock: renameKeys(d.stock, old, v),
      pending: renameKeys(d.pending, old, v),
      exp: renameKeys(d.exp, old, v),
      diff: renameKeys(d.diff, old, v),
    }));
    setOpenRow("i:" + v); setItemMsg("");
  };
  const renameProd = (old, raw) => {
    const v = String(raw || "").trim();
    if (!v) { setItemMsg("이름은 비울 수 없습니다."); return; }
    if (v === old) return;
    if (prods.some((x) => x.n === v)) { setItemMsg("'" + v + "' 제품이 이미 있습니다."); return; }
    setDb((d) => ({
      ...d,
      master: {
        ...d.master,
        prods: d.master.prods.map((x) => (x.n === old ? { ...x, n: v } : x)),
        rec: d.master.rec.map((r) => (r.p === old ? { ...r, p: v } : r)),
        // 달력 제품 이름도 같이 옮깁니다. 안 그러면 달력이 없는 제품을 가리킵니다.
        calProd: d.master.calProd === old ? v : d.master.calProd,
        calProdPrev: d.master.calProdPrev === old ? v : d.master.calProdPrev,
      },
    }));
    if (recProd === old) setRecProd(v);
    // 배합 탭에서 고쳤으면 배합 패널이 그대로 열려 있어야 합니다
    setOpenRow((openRow === "rec:" + old ? "rec:" : "p:") + v);
    setItemMsg("");
  };

  // ── 거래처 ──────────────────────────────────────────────────
  const addVendor = () => {
    let nm = "새 거래처", k = 2;
    while ((master.vendors || []).includes(nm)) { nm = "새 거래처 " + k; k++; }
    setMaster({ ...master, vendors: [...(master.vendors || []), nm] });
    setOpenRow("v:" + nm);
  };
  const renameVendor = (old, raw) => {
    const v = String(raw || "").trim();
    if (!v) { setItemMsg("거래처 이름은 비울 수 없습니다."); return; }
    if (v === old) return;
    if ((master.vendors || []).includes(v)) { setItemMsg("'" + v + "' 거래처가 이미 있습니다."); return; }
    setDb((d) => ({
      ...d,
      master: {
        ...d.master,
        vendors: (d.master.vendors || []).map((x) => (x === old ? v : x)),
        // 품목에 붙어 있는 이름도 같이 옮깁니다
        items: d.master.items.map((x) => ((x.v || "").trim() === old ? { ...x, v: v } : x)),
      },
    }));
    setOpenRow("v:" + v); setItemMsg("");
  };
  const removeVendor = (nm) => {
    setDb((d) => ({
      ...d,
      master: {
        ...d.master,
        vendors: (d.master.vendors || []).filter((x) => x !== nm),
        // 붙어 있던 품목은 '미지정'으로 돌아갑니다 (품목 자체는 안 지웁니다)
        items: d.master.items.map((x) => ((x.v || "").trim() === nm ? { ...x, v: "" } : x)),
      },
    }));
    setOpenRow(null); setItemMsg("");
  };
  const moveVendor = (nm, dir) => {
    const list = (master.vendors || []).slice();
    const i = list.indexOf(nm), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    list[i] = list[j]; list[j] = nm;
    setMaster({ ...master, vendors: list });
  };

  // 생산량 칸에 배합 양이, 배합 양 칸에 1이 들어간 경우를 짚어냅니다.
  // 주간 총량은 같아서 발주 숫자로는 티가 안 나지만, 배합을 고칠 때 완전히 어긋납니다.
  // 예) 부추빵 속 = 주 2500번 × 마요네즈 1g  (맞는 것: 주 1번 × 2500g)
  const swapped = (p) => {
    if (p.mode !== "week" || num(p.every) > 0) return false;
    const lines = rec.filter((r) => r.p === p.n);
    if (lines.length !== 1) return false;            // 재료가 여럿이면 판단할 수 없습니다
    const wk = num(p.wk), amt = num(lines[0].amt);
    // g 단위여야 합니다. '소세지 1낱개 × 주 168번'은 정상이지만
    // '마요네즈 1g × 주 2500번'은 1g짜리 재료라는 뜻이라 말이 안 됩니다.
    if (lines[0].u !== "g") return false;
    return wk >= 50 && amt > 0 && amt <= 1;
  };
  // 생산량과 배합 양을 서로 바꿉니다. 주간 총량은 그대로입니다.
  const swapAmount = (p) => {
    const lines = rec.filter((r) => r.p === p.n);
    if (lines.length !== 1) return;
    const id = lines[0].id, wk = num(p.wk), amt = num(lines[0].amt);
    setDb((d) => ({
      ...d,
      master: {
        ...d.master,
        prods: d.master.prods.map((x) => (x.n === p.n ? { ...x, wk: amt } : x)),
        rec: d.master.rec.map((r) => (r.id === id ? { ...r, amt: wk } : r)),
      },
    }));
  };

  // 입력칸 밑에 결과를 그대로 보여줍니다. 방식을 몰라도 숫자로 확인할 수 있게.
  const wdLabel = openDays.filter((d) => !WEEKEND.includes(d)).map((d) => DAY_LABEL[d]).join("") || "평일";
  const weLabel = openDays.filter((d) => WEEKEND.includes(d)).map((d) => DAY_LABEL[d]).join("") || "주말";
  const preview = (p) => {
    const m = mult[p.n];
    if (!m) return null;
    const u = p.unit || "번";
    return (
      <div style={{ fontSize: 11, color: C.quiet, marginTop: 8, lineHeight: 1.7 }}>
        <span style={{ fontFamily: MONO, color: C.butter }}>
          이번 회차 {fmt(round2(m.period))}{u} · 주 {fmt(round2(m.week))}{u}
        </span>
        <br />
        {p.mode === "week"
          ? "쉬는 요일을 바꿔도 주 " + fmt(round2(m.week)) + u + "은 그대로입니다. 영업일에 나눠 담깁니다."
          : "쉬는 요일을 바꾸면 그만큼 주 합계가 따라 줄어듭니다."}
      </div>
    );
  };

  const patchItem = (name, patch) =>
    setMaster({ ...master, items: items.map((i) => (i.n === name ? { ...i, ...patch } : i)) });
  const removeProd = (n) => {
    setDb((d) => ({
      ...d,
      master: {
        ...d.master,
        prods: d.master.prods.filter((x) => x.n !== n),
        rec: d.master.rec.filter((r) => r.p !== n),
        // 달력 제품을 지우면 달력 kg이 갈 곳이 없어집니다
        calProd: d.master.calProd === n
          ? ((d.master.prods.find((x) => x.n !== n) || {}).n || "")
          : d.master.calProd,
      },
    }));
    setOpenRow(null); setItemMsg("");
  };

  // 생산량 탭에서 제품 상세(설정 → 제품)로 바로 보냅니다
  const editProd = (n) => { setTab("set"); setSetTabSub("prods"); setOpenRow("p:" + n); setItemMsg(""); };

  // 생산량 탭과 설정 탭 양쪽에서 씁니다
  const addProd = () => {
    let n = "새 제품", k = 2;
    while (prods.some((x) => x.n === n)) { n = "새 제품 " + k++; }
    setMaster({ ...master, prods: [...prods, { n, split: null, y: 1, wd: 1, we: 1, mode: "day" }] });
    return n;
  };

  const patchProd = (name, patch) =>
    setMaster({ ...master, prods: prods.map((p) => (p.n === name ? { ...p, ...patch } : p)) });
  const patchRec = (id, patch) =>
    setMaster({ ...master, rec: rec.map((r) => (r.id === id ? { ...r, ...patch } : r)) });

  // 제품별 배수와 재료 소요 — 한 덩어리로 계산합니다.
  // 발효종·탕종처럼 자기가 만들어 자기가 쓰는 중간재는 소요가 정해져야 생산량이 나오고,
  // 생산량이 나와야 그게 먹는 밀가루 소요가 나옵니다. 그래서 순서를 나눠 몇 번 돌립니다.
  const calc = useMemo(() => {
    const yieldOf = {};
    prods.forEach((p) => {
      if (p.y !== null && p.y !== undefined) { yieldOf[p.n] = p.y; return; }
      let s = 0;
      rec.forEach((r) => { if (r.p === p.n && r.inc) s += num(r.amt); });
      yieldOf[p.n] = p.split ? s / p.split : 1;
    });

    // 1) 손으로 넣은 생산량부터
    const out = {};
    prods.forEach((p) => {
      const y = yieldOf[p.n] || 1;
      if (p.n === calProd) {
        out[p.n] = { period: coverKg / y, week: weekKg / y };
        return;
      }
      if (p.mode === "auto") { out[p.n] = { period: 0, week: 0 }; return; }
      // 주 단위 제품은 일주일 총량을 영업 6일로 나눠 하루 배수를 만듭니다.
      // '몇 주에 한 번'으로 적은 것은 1을 그 주기로 나눕니다.
      const wkVal = num(p.every) > 0 ? 1 / num(p.every) : num(p.wk);
      const perDay = p.mode === "week" ? wkVal / openCount : null;
      const wd = perDay !== null ? perDay : num(p.wd);
      const we = perDay !== null ? perDay : num(p.we);
      out[p.n] = { period: (wdDays * wd + weDays * we) / y, week: (wdWeek * wd + weWeek * we) / y };
    });

    // 2) 자가 제조로 켜둔 제품 — 한 배합이 몇 kg 나오는지.
    //    제품 이름과 재료 이름이 다를 수 있어(탕종(자가) → 탕종) 대상을 따로 적습니다.
    const autos = prods.filter((p) => p.mode === "auto" && p.n !== calProd);
    const makesOf = {}, batchKg = {};
    autos.forEach((p) => {
      makesOf[p.n] = (p.makes || "").trim() || p.n;
      let g = 0;
      rec.forEach((r) => { if (r.p === p.n && r.inc && r.u === "g") g += num(r.amt); });
      batchKg[p.n] = g / 1000;
    });

    // 3) 소요를 세고, 자가 제조분을 그만큼 돌리고, 다시 셉니다.
    //    서로 물릴 수 있어 값이 안 움직일 때까지 (넉넉히 6번) 반복합니다.
    let need = {}, weekNeed = {};
    for (let pass = 0; pass < 6; pass++) {
      need = {}; weekNeed = {};
      rec.forEach((r) => {
        const m = out[r.p];
        if (!m) return;
        const div = r.u === "g" ? 1000 : 1;
        need[r.m] = (need[r.m] || 0) + (num(r.amt) * m.period) / div;
        weekNeed[r.m] = (weekNeed[r.m] || 0) + (num(r.amt) * m.week) / div;
      });
      let moved = false;
      autos.forEach((p) => {
        const b = batchKg[p.n], k = makesOf[p.n];
        if (!b) return;
        const np = round2((need[k] || 0) / b);
        const nw = round2((weekNeed[k] || 0) / b);
        if (out[p.n].period !== np || out[p.n].week !== nw) {
          out[p.n] = { period: np, week: nw }; moved = true;
        }
      });
      if (!moved) break;
    }
    return { mult: out, need, weekNeed, batchKg, makesOf };
  }, [master, dough, cycle, plan, coverKg, weekKg, wdDays, weDays, wdWeek, weWeek, openCount, calProd]);
  const mult = calc.mult;

  const rows = useMemo(() => {
    const need = calc.need, weekNeed = calc.weekNeed;

    return items.map((i) => {
      const spec = num(i.spec) || 1;
      const box = num(i.box) || 1;
      const extra = num(i.extra), safe = num(i.safe);
      const periodNeed = need[i.n] || 0;
      const needU = periodNeed / spec;
      const have = cur(i.n);
      const short = needU + extra + safe - have;
      // 낱개로 부족한 만큼 → 박스로 올려서 시킵니다
      const pieces = short > 0 ? Math.ceil(round2(short)) : 0;
      const order = pieces > 0 ? Math.ceil(pieces / box) : 0;
      const gotPieces = order * box;
      return {
        ...i, spec, box, extra, safe, periodNeed, weekNeed: weekNeed[i.n] || 0,
        needU, have, short, pieces, order, gotPieces,
        ou: box > 1 ? (i.bu || "박스") : i.iu,
      };
    });
  }, [master, calc, stock]);

  const byName = useMemo(() => Object.fromEntries(rows.map((r) => [r.n, r])), [rows]);
  // 배합 줄의 '개'는 사실 그 품목의 낱개 단위(장·캔·개…)입니다
  const suOf = (m) => (byName[m] && byName[m].su) || "개";
  const orders = rows.filter((r) => r.flag === "O" && r.order > 0);
  // 받는 쪽이 포대인지 개인지 알아야 하므로 단위를 항상 붙입니다
  const lineOf = (r) => r.n + " " + fmt(r.order) + (r.ou && r.ou !== "-" ? r.ou : "");
  const slip = orders.map(lineOf).join("\n");

  // 거래처별로 나눠 보냅니다. 밀가루집과 유지집에 한 덩어리로 보낼 수는 없으니까요.
  const vendors = master.vendors || [];
  const venOf = (r) => (r.v || "").trim() || NOVEN;
  const orderGroups = (() => {
    const bag = {}, seen = [];
    orders.forEach((r) => {
      const v = venOf(r);
      if (!bag[v]) { bag[v] = []; seen.push(v); }
      bag[v].push(r);
    });
    // 설정에 적어둔 순서를 먼저, 목록에 없는 이름은 뒤에, 미지정은 맨 끝
    const order = [
      ...vendors.filter((v) => bag[v]),
      ...seen.filter((v) => !vendors.includes(v) && v !== NOVEN),
      ...(bag[NOVEN] ? [NOVEN] : []),
    ];
    return order.map((v) => ({ v, rows: bag[v], text: bag[v].map(lineOf).join("\n") }));
  })();

  const needSpec = useMemo(() => items.filter((i) => i.chk).map((i) => i.n), [master]);

  // ── 발주 → 입고 → 예상 재고 → 차이 ──────────────────────────
  const pending = db.pending || {};
  const exp = db.exp || {};
  const diff = db.diff || {};
  const pendingList = Object.keys(pending).filter((n) => num(pending[n]) > 0);

  // 오늘 이미 발주를 기록했는지 — 두 번 누르면 차이 기록에 가짜 0이 쌓입니다
  const recToday = db.expAt === ymd(today);

  // 발주를 넣었다고 기록합니다. 시킨 수량을 기억하고, 이번 회차가 끝났을 때
  // 남아 있을 재고를 미리 계산해 둡니다. 지난번 예상이 있으면 실제와 비교해 차이를 남깁니다.
  //
  // 같은 날 다시 누르면(재고를 고쳐서 다시 넣는 경우) 새 기록을 덧붙이지 않고
  // 방금 남긴 차이를 고쳐 씁니다. 기준은 덮어쓰기 전의 예상값(expPrev)입니다.
  const recordOrder = () => {
    const again = recToday;
    const base = again ? (db.expPrev || {}) : exp;
    const nextDiff = { ...diff };
    rows.forEach((r) => {
      if (base[r.n] === undefined) return;
      const d = round2(r.have - num(base[r.n]));
      const hist = nextDiff[r.n] || [];
      nextDiff[r.n] = (again ? hist.slice(0, -1) : hist).concat(d).slice(-6);
    });
    const nextPending = {}, nextExp = {};
    rows.forEach((r) => {
      if (r.flag === "X") return;
      if (r.order > 0) nextPending[r.n] = r.gotPieces || r.order;
      nextExp[r.n] = Math.max(0, round2(r.have - r.needU));
    });
    setDb((d) => ({
      ...d, pending: nextPending, exp: nextExp, expPrev: base,
      diff: nextDiff, expAt: ymd(today), filled: false,
    }));
  };

  // 물건이 들어왔습니다 — 시킨 수량을 재고에 더합니다
  const applyIncoming = () => {
    const nextStock = { ...stock }, nextExp = { ...exp };
    pendingList.forEach((n) => {
      nextStock[n] = round2(cur(n) + num(pending[n]));
      if (nextExp[n] !== undefined) nextExp[n] = round2(num(nextExp[n]) + num(pending[n]));
    });
    setDb((d) => ({ ...d, stock: nextStock, exp: nextExp, pending: {} }));
  };

  // 예상값을 재고 칸에 미리 깔아 둡니다. 맞으면 넘기고 틀린 것만 고치면 됩니다.
  const fillExpected = () => {
    setDb((d) => ({ ...d, stock: { ...d.stock, ...exp }, filled: true }));
  };

  // 예상값은 회차가 끝난 뒤(다음 발주일) 채워야 맞습니다. 입고 직후에 채우면
  // 아직 쓰지도 않은 한 회차치가 재고에서 그대로 빠집니다.
  const expDue = !!db.expAt && db.expAt !== ymd(today) && orderDays.includes(WD_KEY[today.getDay()]);

  const diffText = (n) => {
    const a = diff[n];
    if (!a || !a.length) return "";
    return a.map((v) => (v > 0 ? "+" : "") + fmt(v)).join(" ");
  };

  // 배합에는 있는데 품목 목록에 없는 재료 — 계산에서 조용히 빠지므로 경고
  const orphans = useMemo(() => {
    const known = new Set(items.map((i) => i.n));
    const miss = new Set();
    rec.forEach((r) => { if (r.m && !known.has(r.m)) miss.add(r.m); });
    return [...miss];
  }, [master]);

  const copyGroup = async (g) => {
    try { await navigator.clipboard.writeText(g.text); setCopied(g.v); }
    catch (e) { setCopied(""); }
    setTimeout(() => setCopied(""), 2000);
  };

  const stateBody = () => JSON.stringify({ 매장: master.shop || "", 회차: cycle, 발주요일: orderDays, 영업요일: openDays, 정렬: sortMode, 단과자: dough, 날짜별: days, 쉬는날: off, 생산계획: plan, 재고: stock, 마스터: master });
  // 내보내기 칸을 열었을 때만 만듭니다. 늘 만들면 글자 하나 칠 때마다 렉이 걸립니다.
  const stateJson = useMemo(() => (outOpen ? stateBody() : ""), [outOpen, db]);
  const copyState = async () => {
    if (outOpen) { setOutOpen(false); return; }
    setOutOpen(true); setPasteOpen(false);
    try {
      await navigator.clipboard.writeText(stateBody());
      setStateCopied(true);
    } catch (e) { setStateCopied(false); }
  };
  const loadState = () => {
    let o;
    try { o = JSON.parse(pasteText.trim()); }
    catch (e) { setPasteMsg("형식이 맞지 않습니다. 복사한 글자를 통째로 붙여넣어 주세요."); return; }
    if (!o || typeof o !== "object") { setPasteMsg("형식이 맞지 않습니다."); return; }
    const from = o["매장"] || (o["마스터"] && o["마스터"].shop) || "";
    const here = master.shop || "";
    if (from && here && from !== here && overwriteFrom !== from) {
      setOverwriteFrom(from);
      setPasteMsg("'" + from + "' 데이터입니다. 이 폰은 '" + here + "'입니다. 덮어쓰려면 불러오기를 한 번 더 누르세요.");
      return;
    }
    setOverwriteFrom("");
    if (Array.isArray(o["영업요일"]) && o["영업요일"].length >= 2) setOpenDays(o["영업요일"].filter((d) => ALL_WEEK.includes(d)));
    if (Array.isArray(o["발주요일"]) && o["발주요일"].length) setOrderDays(o["발주요일"].filter((d) => ALL_WEEK.includes(d)));
    if (o["정렬"] === "cat" || o["정렬"] === "manual") setSortMode(o["정렬"]);
    if (typeof o["회차"] === "string" && ALL_WEEK.includes(o["회차"])) setCycle(o["회차"]);
    if (o["단과자"] && typeof o["단과자"] === "object") setDough({ ...DOUGH_DEFAULT, ...o["단과자"] });
    if (o["날짜별"] && typeof o["날짜별"] === "object") setDays(o["날짜별"]);
    if (o["쉬는날"] && typeof o["쉬는날"] === "object") setDb((x) => ({ ...x, off: o["쉬는날"] }));
    if (o["생산계획"] && typeof o["생산계획"] === "object") setPlan({ ...PLAN_DEFAULT, ...o["생산계획"] });
    if (o["재고"] && typeof o["재고"] === "object") setStock(o["재고"]);
    if (o["마스터"] && o["마스터"].items && o["마스터"].prods && o["마스터"].rec) {
      // 옛 버전에서 뜬 백업 글자도 받아줍니다. 이걸 안 태우면 예전 형식 그대로 들어와
      // 규격·단위 보정이 빠진 채 계산됩니다.
      setMaster(upgrade(o["마스터"], o["생산계획"] || plan));
    } else if (o["생산량"] && typeof o["생산량"] === "object") {
      // 예전 형식 — 생산량 수정분만 반영
      setMaster({
        ...master,
        prods: master.prods.map((p) => (o["생산량"][p.n] ? { ...p, ...o["생산량"][p.n] } : p)),
      });
    }
    setPasteText(""); setPasteMsg("불러왔습니다");
    setTimeout(() => { setPasteMsg(""); setPasteOpen(false); }, 1600);
  };

  const editLink = {
  background: "none", border: "none", padding: 0, cursor: "pointer",
  fontFamily: FONT, textAlign: "left", display: "flex", alignItems: "baseline",
};
const sectionLabel = { fontSize: 11, letterSpacing: "0.16em", color: C.quiet, fontWeight: 700, marginBottom: 8 };
  const card = { background: C.surface, border: "1px solid " + C.line, borderRadius: 16, padding: 16, marginBottom: 20 };

  // 재고 탭에 보일 분류. '제외(X)'는 분류순에서도 빠집니다 ('내 순서'와 같게).
  const shown = rows.filter((r) => r.flag === "O" || r.flag === "체크");
  // 분류는 품목마다 정합니다. 안 적었으면 기본 분류, 그것도 없으면 '기타'.
  const catOf = (r) => (r.cat || "").trim() || CAT_OF[r.n] || "기타";
  const bucket = {}, seen = [];
  shown.forEach((r) => {
    const c = catOf(r);
    if (!bucket[c]) { bucket[c] = []; seen.push(c); }
    bucket[c].push(r.n);
  });
  // 기본 분류를 먼저, 새로 만든 분류는 그 뒤, '기타'는 맨 끝
  const groups = [
    ...CAT_NAMES.filter((c) => bucket[c]),
    ...seen.filter((c) => !CAT_NAMES.includes(c) && c !== "기타"),
    ...(bucket["기타"] ? ["기타"] : []),
  ].map((c) => [c, bucket[c]]);
  // 분류 칸에서 고를 수 있는 목록
  const allCats = [...new Set([...CAT_NAMES, ...items.map((i) => (i.cat || "").trim()).filter(Boolean)])];
  const allVendors = [...new Set([...(master.vendors || []), ...items.map((i) => (i.v || "").trim()).filter(Boolean)])];

  // 내가 정한 순서 — master.ord 에 이름만 줄줄이 저장합니다.
  // 목록에 새로 생긴 품목은 자동으로 맨 뒤에 붙습니다.
  const names = shown.map((r) => r.n);
  const savedOrd = (master.ord || []).filter((n) => names.includes(n));
  const manualNames = [...savedOrd, ...names.filter((n) => !savedOrd.includes(n))];
  const moveItem = (name, dir) => {
    const list = manualNames.slice();
    const i = list.indexOf(name), j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    list[i] = list[j]; list[j] = name;
    setMaster({ ...master, ord: list });
  };

  const moveBtn = {
    width: 38, height: 34, background: C.raised, color: C.flour, border: "none",
    borderRadius: 9, fontSize: 15, cursor: "pointer", lineHeight: 1, flexShrink: 0, fontFamily: FONT,
  };

  // 재고 한 줄 — 분류순·내 순서 양쪽에서 같이 씁니다
  const stockRow = (n, idx) => {
    const r = byName[n];
    if (!r) return null;
    const editing = idx !== undefined && reorder;
    return (
      <div key={n} className="flex items-center" style={{
        justifyContent: "space-between", gap: 8, padding: "10px 0",
        borderBottom: "1px solid " + C.surface,
      }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          <div style={{ fontSize: 14, fontWeight: 600 }}>{n}</div>
          {!editing && (
            <div>
              <div style={{ fontSize: 11, color: C.muted, fontFamily: MONO, marginTop: 2 }}>
                {r.spec}{r.su}/{r.iu} · 주 {fmt(r.weekNeed)}{r.su}
              </div>
              <div style={{ fontSize: 11, color: r.order > 0 ? C.muted : C.quiet, fontFamily: MONO, marginTop: 2 }}>
                {basis(r)}{r.box > 1 ? " · 1" + r.ou + "=" + r.box + r.iu : ""}
              </div>
              {exp[n] !== undefined && (
                <div style={{ fontSize: 10.5, fontFamily: MONO, marginTop: 2, color: round2(r.have - num(exp[n])) === 0 ? C.quiet : C.butter }}>
                  예상 {fmt(num(exp[n]))}
                  {round2(r.have - num(exp[n])) !== 0 ? " · 차이 " + (r.have - num(exp[n]) > 0 ? "+" : "") + fmt(round2(r.have - num(exp[n]))) : " · 맞음"}
                  {diffText(n) ? " · 지난 " + diffText(n) : ""}
                </div>
              )}
            </div>
          )}
          {editing && (
            <div style={{ fontSize: 11, color: C.quiet, fontFamily: MONO, marginTop: 2 }}>
              {idx + 1}번째
            </div>
          )}
        </div>
        {editing ? (
          <div className="flex items-center" style={{ gap: 5 }}>
            <button style={{ ...moveBtn, opacity: idx === 0 ? 0.35 : 1 }}
              onClick={() => moveItem(n, -1)} aria-label="위로">▲</button>
            <button style={{ ...moveBtn, opacity: idx === manualNames.length - 1 ? 0.35 : 1 }}
              onClick={() => moveItem(n, 1)} aria-label="아래로">▼</button>
          </div>
        ) : (
          <div className="flex items-center" style={{ gap: 8 }}>
            <Stepper value={cur(n)} onChange={(v) => setStock({ ...stock, [n]: v })} />
            <div style={{
              minWidth: 44, textAlign: "right", fontFamily: MONO,
              fontVariantNumeric: "tabular-nums", color: r.order > 0 ? C.butter : C.quiet,
            }}>
              <div style={{ fontSize: 19, fontWeight: 800 }}>{r.order > 0 ? fmt(r.order) : "–"}</div>
              {r.order > 0 && r.box > 1 && (
                <div style={{ fontSize: 9.5, color: C.quiet, marginTop: 1 }}>{r.ou}</div>
              )}
            </div>
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ background: C.ink, minHeight: "100vh", fontFamily: FONT, color: C.flour }}>
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "20px 16px 48px" }}>

        <div style={{ fontSize: 11, letterSpacing: "0.18em", color: C.quiet, fontWeight: 600 }}>{master.shop || "매장 이름 없음"}</div>
        <h1 style={{ fontSize: 34, fontWeight: 800, letterSpacing: "-0.04em", margin: "2px 0 10px" }}>발주 전표</h1>

        {saveState === "error" && (
          <div style={{ border: "1px solid " + C.warn, borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
            <div style={{ fontSize: 12, color: C.warn, lineHeight: 1.6 }}>
              저장이 안 되고 있습니다. 지금 화면은 살아 있지만 앱을 닫으면 사라집니다.
              맨 아래 내보내기로 글자를 떠서 카톡에 붙여 두세요.
            </div>
            <div style={{ fontSize: 10.5, color: C.quiet, fontFamily: MONO, marginTop: 6, lineHeight: 1.5, wordBreak: "break-all" }}>
              {saveErr || "이유 없음"}
              <br />
              담을 크기 {JSON.stringify(db).length.toLocaleString()}자 · 저장소 {typeof window !== "undefined" && window.storage ? "있음" : "없음"}
            </div>
            <div style={{ marginTop: 9 }}>
              <GhostBtn onClick={() => { setSaveState("saving"); writeNow(JSON.stringify(db)); }}>지금 다시 저장</GhostBtn>
            </div>
          </div>
        )}
        {saveState !== "error" && (
          <div style={{ fontSize: 10.5, color: C.quiet, marginBottom: 14 }}>
            {saveState === "saved" ? "저장됨" : saveState === "saving" ? "저장 중…" : ""}
          </div>
        )}

        {ready && Object.keys(stock).length === 0 && !pasteOpen && (
          <div style={{ ...card, marginBottom: 16, padding: "12px 14px" }}>
            <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6 }}>
              재고가 아직 기본값입니다. 지난 앱에서 내보낸 설정이 있으면 불러오세요.
            </div>
            <button onClick={() => {
              setPasteOpen(true);
              setTimeout(() => {
                const el = document.getElementById("state-move");
                if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
              }, 60);
            }} style={{
              marginTop: 9, padding: "8px 14px", borderRadius: 8, background: "transparent",
              color: C.butter, border: "1px solid " + C.butter, fontSize: 12.5,
              fontWeight: 600, cursor: "pointer", fontFamily: FONT,
            }}>설정 불러오기</button>
          </div>
        )}

        <div className="flex" style={{ gap: 8, marginBottom: 18 }}>
          {orderDays.map((k) => {
            const cv = coverFor(k, orderDays);
            return (
              <button key={k} onClick={() => setCycle(k)} style={{
                flex: 1, textAlign: "left", padding: "12px 14px", borderRadius: 12, cursor: "pointer",
                background: cycle === k ? C.butter : C.surface,
                color: cycle === k ? C.ink : C.flour,
                border: "1px solid " + (cycle === k ? C.butter : C.line), fontFamily: FONT,
              }}>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{DAY_LABEL[k]}요일 발주</div>
                <div style={{ fontSize: 11, opacity: 0.7, marginTop: 2 }}>
                  {cv.map((d) => DAY_LABEL[d]).join(" · ")}
                </div>
              </button>
            );
          })}
        </div>

        <div style={card}>
          <div className="flex items-start" style={{ justifyContent: "space-between", marginBottom: 12 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700 }}>{calProd}</div>
              <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>
                날짜를 눌러 그날 친 양이나 쉬는 날을 정하세요
              </div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: MONO, fontSize: 26, fontWeight: 800, color: C.butter, fontVariantNumeric: "tabular-nums" }}>{fmt(coverKg)}</div>
              <div style={{ fontSize: 10, color: C.muted, letterSpacing: "0.1em" }}>이번 회차 kg</div>
            </div>
          </div>

          <div className="flex items-center" style={{ justifyContent: "space-between", marginBottom: 10 }}>
            <button onClick={() => setMonthAnchor(new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() - 1, 1))}
              style={{ ...moveBtn, width: 34 }}>◀</button>
            <div style={{ fontSize: 14, fontWeight: 700 }}>
              {monthAnchor.getFullYear()}년 {monthAnchor.getMonth() + 1}월
            </div>
            <button onClick={() => setMonthAnchor(new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 1))}
              style={{ ...moveBtn, width: 34 }}>▶</button>
          </div>

          <div className="grid grid-cols-7" style={{ gap: 3, marginBottom: 4 }}>
            {WD_HEAD.map((h, i) => (
              <div key={h} style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: i === 0 ? C.warn : C.quiet }}>{h}</div>
            ))}
          </div>
          <div className="grid grid-cols-7" style={{ gap: 3 }}>
            {(() => {
              const first = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth(), 1);
              const last = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 0).getDate();
              const cells = [];
              for (let i = 0; i < first.getDay(); i++) cells.push(<div key={"b" + i} />);
              const coverSet = new Set(cycleDates.map((d) => ymd(d)));
              for (let n = 1; n <= last; n++) {
                const d = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth(), n);
                const key = ymd(d), wk = WD_KEY[d.getDay()];
                const closed = !openDays.includes(wk);
                const rest = !!off[key];
                const isToday = key === ymd(today);
                const inCover = coverSet.has(key);
                const isOrder = orderDays.includes(wk);
                const fixed = days[key] !== undefined && !rest;
                const sel = selDate === key;
                cells.push(
                  <button key={key} disabled={closed}
                    onClick={() => setSelDate(sel ? null : key)}
                    style={{
                      padding: "4px 1px 5px", borderRadius: 8, textAlign: "center", fontFamily: FONT,
                      cursor: closed ? "default" : "pointer", opacity: closed ? 0.35 : 1,
                      background: sel ? C.butter : (inCover ? C.raised : "transparent"),
                      border: "1px solid " + (sel ? C.butter : isToday ? C.flour : (rest ? C.warn : (isOrder ? C.line : "transparent"))),
                      color: sel ? C.ink : C.flour,
                    }}>
                    <div style={{ fontSize: 10.5, fontWeight: 700, color: sel ? C.ink : (d.getDay() === 0 ? C.warn : C.muted) }}>
                      {n}{isOrder ? "·" : ""}
                    </div>
                    <div style={{
                      fontFamily: MONO, fontSize: 12, fontWeight: fixed ? 800 : 500,
                      color: sel ? C.ink : (rest ? C.warn : (closed ? C.quiet : (fixed ? C.butter : C.quiet))),
                      fontVariantNumeric: "tabular-nums", marginTop: 1,
                    }}>{closed ? "휴" : rest ? "쉼" : fmt(kgOf(d))}</div>
                  </button>
                );
              }
              return cells;
            })()}
          </div>

          {selDate && (
            <div style={{ marginTop: 12, background: C.ink, border: "1px solid " + C.line, borderRadius: 10, padding: "11px 12px" }}>
              <div className="flex items-center" style={{ justifyContent: "space-between", gap: 8 }}>
                <div>
                  <div style={{ fontSize: 13.5, fontWeight: 700 }}>
                    {parseYmd(selDate).getMonth() + 1}월 {parseYmd(selDate).getDate()}일 ({WD_HEAD[parseYmd(selDate).getDay()]})
                  </div>
                  <div style={{ fontSize: 10.5, color: off[selDate] ? C.warn : C.quiet, marginTop: 2 }}>
                    {off[selDate]
                      ? "쉬는 날 · 이 날 생산량은 전부 빠집니다"
                      : days[selDate] !== undefined ? "따로 고친 값" : "요일 기본값 " + fmt(num(dough[WD_KEY[parseYmd(selDate).getDay()]])) + "kg"}
                  </div>
                </div>
                {!off[selDate] && (
                  <Stepper value={kgOf(parseYmd(selDate))} step={5}
                    onChange={(v) => setDays({ ...days, [selDate]: v })} />
                )}
              </div>
              <div className="flex items-center" style={{ gap: 7, marginTop: 10, flexWrap: "wrap" }}>
                <Pill on={!!off[selDate]} onClick={() => toggleOff(selDate)}>
                  {off[selDate] ? "쉬는 날 해제" : "이 날 쉼"}
                </Pill>
                {days[selDate] !== undefined && !off[selDate] && (
                  <GhostBtn onClick={() => { const n = { ...days }; delete n[selDate]; setDays(n); }}>기본값으로</GhostBtn>
                )}
              </div>
            </div>
          )}

          <div style={{ fontSize: 11, color: C.muted, marginTop: 12, fontFamily: MONO, lineHeight: 1.6 }}>
            이번 회차 {openDates.length
              ? openDates.map((d) => (d.getMonth() + 1) + "/" + d.getDate()).join(" · ")
              : "없음"} · 영업 {openDates.length}일 · {calProd} {fmt(coverKg)}
            {cycleDates.length !== openDates.length
              ? " · 쉬는 날 " + cycleDates.filter((d) => isOff(d)).map((d) => (d.getMonth() + 1) + "/" + d.getDate()).join(" ")
              : ""}
          </div>

          <div className="flex" style={{ gap: 6, marginTop: 12, flexWrap: "wrap" }}>
            <Pill on={baseEdit} onClick={() => { setBaseEdit(!baseEdit); setDayEdit(false); setOpenEdit(false); }}>요일 기본값</Pill>
            <Pill on={dayEdit} onClick={() => { setDayEdit(!dayEdit); setBaseEdit(false); setOpenEdit(false); }}>발주 요일</Pill>
            <Pill on={openEdit} onClick={() => { setOpenEdit(!openEdit); setBaseEdit(false); setDayEdit(false); }}>고정 휴무</Pill>
          </div>

          {openEdit && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 11, color: C.quiet, lineHeight: 1.6, marginBottom: 8 }}>
                문 여는 요일을 켜 둡니다. 꺼 둔 요일은 달력에서 '휴'로 잠기고 회차 계산에서 통째로 빠집니다.
                하루만 쉬는 것은 달력에서 그 날짜를 눌러 '이 날 쉼'으로 하세요.
              </div>
              <div className="flex" style={{ gap: 6, flexWrap: "wrap" }}>
                {ALL_DAYS.map((d) => (
                  <Pill key={d.k} on={openDays.includes(d.k)} onClick={() => toggleOpenDay(d.k)}>{d.label}</Pill>
                ))}
              </div>
              <div style={{ fontSize: 11, color: C.quiet, marginTop: 8, lineHeight: 1.6, fontFamily: MONO }}>
                영업 주 {openDays.length}일 (평일 {wdWeek} · 주말 {weWeek})
              </div>
              <div style={{ fontSize: 11, color: C.warn, marginTop: 6, lineHeight: 1.6 }}>
                여기를 바꾸면 주간 생산량과 소요가 전부 다시 계산됩니다. 바꾼 뒤 생산량 탭을 한 번 확인하세요.
              </div>
            </div>
          )}

          {baseEdit && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 11, color: C.quiet, lineHeight: 1.6, marginBottom: 8 }}>
                날짜를 따로 안 고친 날에 깔리는 값입니다. 여기를 바꾸면 안 고친 날이 전부 따라 바뀝니다.
              </div>
              <div className="grid grid-cols-3" style={{ gap: 7 }}>
                {openDays.map((k) => (
                  <Field key={k} label={DAY_LABEL[k] + "요일"}>
                    <Num value={num(dough[k])} onChange={(v) => setDough({ ...dough, [k]: v })} />
                  </Field>
                ))}
              </div>
            </div>
          )}

          {dayEdit && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 11, color: C.quiet, lineHeight: 1.6, marginBottom: 8 }}>
                발주 넣는 요일입니다. 발주일 다음 영업일부터 그 다음 발주일까지가 한 회차입니다.
              </div>
              <div className="flex" style={{ gap: 6, flexWrap: "wrap" }}>
                {openDays.map((k) => (
                  <Pill key={k} on={orderDays.includes(k)} onClick={() => toggleOrderDay(k)}>{DAY_LABEL[k]}</Pill>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="flex" style={{ gap: 4, marginBottom: 16 }}>
          {[["stock", "재고"], ["prod", "생산량"], ["slip", "발주 " + orders.length], ["check", "눈확인"], ["set", "설정"]].map(([k, t]) => (
            <button key={k} onClick={() => { setTab(k); setOpenRow(null); setArmed(""); }} style={{
              flex: 1, padding: "9px 2px", borderRadius: 999, fontSize: 11.5, fontWeight: 600, cursor: "pointer",
              background: tab === k ? C.flour : "transparent",
              color: tab === k ? C.ink : C.muted,
              border: "1px solid " + (tab === k ? C.flour : C.line), fontFamily: FONT,
            }}>{t}</button>
          ))}
        </div>

        {!ready && <div style={{ color: C.muted, fontSize: 13, padding: 20, textAlign: "center" }}>불러오는 중…</div>}

        {/* ── 재고 ── */}
        {ready && tab === "stock" && (
          <div>
            {pendingList.length > 0 && (
              <div style={{ ...card, marginBottom: 14, padding: "13px 14px", borderColor: C.butter }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: C.butter }}>입고 안 된 발주 {pendingList.length}품목</div>
                <div style={{ fontSize: 11.5, color: C.muted, fontFamily: MONO, marginTop: 5, lineHeight: 1.6 }}>
                  {pendingList.map((n) => n + " " + fmt(num(pending[n])) + ((byName[n] && byName[n].iu) || "")).join(" · ")}
                </div>
                <div className="flex" style={{ gap: 7, marginTop: 10, flexWrap: "wrap" }}>
                  <GhostBtn onClick={applyIncoming}>물건 들어왔음 — 재고에 더하기</GhostBtn>
                  <GhostBtn danger onClick={() => setDb((d) => ({ ...d, pending: {} }))}>지우기</GhostBtn>
                </div>
              </div>
            )}

            {Object.keys(exp).length > 0 && !db.filled && pendingList.length === 0 && (
              <div style={{ ...card, marginBottom: 14, padding: "13px 14px" }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>예상 재고가 준비돼 있습니다</div>
                <div style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.6, marginTop: 4 }}>
                  지난 회차 재고에서 이번에 나갈 양을 뺀 값입니다. 채워 넣고 맞는 건 넘기고 틀린 것만 고치세요.
                </div>
                {!expDue && (
                  <div style={{ fontSize: 11.5, color: C.warn, lineHeight: 1.65, marginTop: 7 }}>
                    아직 이번 회차가 안 끝났습니다 ({db.expAt} 발주).
                    지금 채우면 아직 쓰지도 않은 양까지 재고에서 빠집니다.
                    마감하고 다음 발주일에 누르세요.
                  </div>
                )}
                <div style={{ marginTop: 10 }}>
                  <GhostBtn onClick={() => {
                    if (!expDue && armed !== "fill") { setArmed("fill"); return; }
                    fillExpected(); setArmed("");
                  }}>{(!expDue && armed === "fill") ? "그래도 채웁니다 — 한 번 더" : "예상값 채우기"}</GhostBtn>
                </div>
              </div>
            )}

            <div className="flex items-center" style={{ gap: 6, marginBottom: 16 }}>
              <Pill on={sortMode === "cat"} onClick={() => { setSortMode("cat"); setReorder(false); }}>분류순</Pill>
              <Pill on={sortMode === "manual"} onClick={() => setSortMode("manual")}>내 순서</Pill>
              <div style={{ flex: 1 }} />
              {sortMode === "manual" && (
                <Pill on={reorder} onClick={() => setReorder(!reorder)}>{reorder ? "다 바꿨음" : "순서 바꾸기"}</Pill>
              )}
            </div>

            {sortMode === "manual" ? (
              <div>
                {reorder && (
                  <div style={{ fontSize: 11.5, color: C.quiet, lineHeight: 1.6, marginBottom: 12 }}>
                    ▲▼ 로 자주 세는 품목을 위로 올리세요. 정한 순서는 저장되고 내보내기에도 같이 담깁니다.
                    다 바꿨으면 위 버튼을 눌러 재고 입력으로 돌아갑니다.
                  </div>
                )}
                {manualNames.map((n, idx) => stockRow(n, idx))}
              </div>
            ) : (
              groups.map(([cat, ns]) => (
                <div key={cat} style={{ marginBottom: 22 }}>
                  <div style={sectionLabel}>{cat}</div>
                  {ns.map((n) => stockRow(n))}
                </div>
              ))
            )}
          </div>
        )}

        {/* ── 생산량 ── */}
        {ready && tab === "prod" && (
          <div>
            <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.7, marginBottom: 18 }}>
              여기를 바꾸면 재료 소요가 전부 다시 계산됩니다.
              위 달력으로 세는 제품은 여기 목록에 나오지 않습니다.
            </div>

            <div style={sectionLabel}>매일 치는 것</div>
            <div style={{ fontSize: 11.5, color: C.quiet, lineHeight: 1.6, marginBottom: 12 }}>
              하루에 몇 k(또는 몇 배합) 치는지 넣습니다.
            </div>
            {prods.filter((p) => p.n !== calProd && p.mode !== "week" && p.mode !== "auto").map((p) => (
              <div key={p.n} style={{ padding: "12px 0", borderBottom: "1px solid " + C.surface }}>
                <div className="flex items-baseline" style={{ justifyContent: "space-between", marginBottom: 8 }}>
                  <button onClick={() => editProd(p.n)} style={editLink}>
                    <span style={{ fontSize: 14, fontWeight: 600, color: C.flour }}>{p.n}</span>
                    <span style={{ fontSize: 10.5, color: C.butter, marginLeft: 7 }}>고치기</span>
                  </button>
                  <div style={{ fontSize: 10.5, color: C.quiet, fontFamily: MONO }}>
                    {p.split ? p.split + "g 분할" : "배합 단위"} · 주 {fmt(round2(wdWeek * num(p.wd) + weWeek * num(p.we)))}{p.unit || ""}
                  </div>
                </div>
                {p.note && <div style={{ fontSize: 10.5, color: C.quiet, marginBottom: 6 }}>{p.note}</div>}
                {[[wdLabel + " 하루", "wd", wdWeek], [weLabel + " 하루", "we", weWeek]]
                  .filter(([, , cnt]) => cnt > 0).map(([label, key]) => (
                  <div key={key} className="flex items-center" style={{ justifyContent: "space-between", marginTop: 6 }}>
                    <span style={{ fontSize: 12.5, color: C.muted }}>{label}</span>
                    <Stepper value={num(p[key])} step={stepFor(num(p[key]))}
                      onChange={(v) => patchProd(p.n, { [key]: v })} />
                  </div>
                ))}
              </div>
            ))}

            <div style={{ ...sectionLabel, marginTop: 30 }}>주 1~2회 돌리는 것</div>

                                  {!known && <span style={{ color: C.butter, fontSize: 10.5 }}> · 새 재료</span>}
                                  {unitOdd && <span style={{ color: C.warn, fontSize: 10.5 }}> · {known.su} 단위 품목</span>}
                                  {l.noUnit && <span style={{ color: C.warn, fontSize: 10.5 }}> · 단위를 안 적어 {l.u === "g" ? "g" : (known ? known.su : "개")}로 읽었습니다</span>}
                                </span>
                                <span style={{ fontSize: 12.5, fontFamily: MONO, color: C.muted }}>{fmt(l.amt)}{l.u === "g" ? "g" : (known ? known.su : "개")}</span>
                              </div>
                            );
                          })}
                          <div style={{ fontSize: 11, color: C.quiet, marginTop: 9, lineHeight: 1.6 }}>
                            새 재료는 품목에 자동으로 만들어집니다. 넣은 뒤 설정 → 품목에서 규격(한 포대 몇 kg인지)을 꼭 채워 주세요.
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* 제품별 배합 목록 */}
                <input value={filter} onChange={(e) => setFilter(e.target.value)} placeholder="제품 찾기"
                  style={{ ...inputBase, width: "100%", fontFamily: FONT, fontSize: 13.5, marginBottom: 12 }} />
                {prods.filter((p) => !filter || p.n.includes(filter)).map((p) => {
                  const lines = rec.filter((r) => r.p === p.n);
                  const open = openRow === "rec:" + p.n;
                  return (
                    <div key={p.n} style={{ borderBottom: "1px solid " + C.surface, padding: "10px 0" }}>
                      <div style={{ cursor: "pointer" }} onClick={() => { setOpenRow(open ? null : "rec:" + p.n); setRecProd(p.n); }}>
                        <div className="flex items-center" style={{ justifyContent: "space-between", gap: 8 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 600 }}>{p.n}</div>
                          <div style={{ fontSize: 11, color: C.quiet, fontFamily: MONO }}>
                            재료 {lines.length} · {open ? "닫기" : "고치기"}
                          </div>
                        </div>
                        {!open && (
                          <div style={{ fontSize: 11.5, color: C.muted, fontFamily: MONO, marginTop: 4, lineHeight: 1.6 }}>
                            {lines.length === 0
                              ? <span style={{ color: C.warn }}>배합 없음</span>
                              : lines.map((r, k) => (
                                <span key={r.id}>
                                  {k > 0 && <span style={{ color: C.quiet }}> · </span>}
                                  {(r.m || "?") + " " + fmt(r.amt) + (r.u === "g" ? "g" : suOf(r.m))}
                                  <span style={{ color: C.butter }}>
                                    {" \u2192 \uc8fc "}{amtText(num(r.amt) * ((mult[p.n] && mult[p.n].week) || 0), r.u, suOf(r.m))}
                                  </span>
                                </span>
                              ))}
                          </div>
                        )}
                      </div>

                      {open && (
                        <div style={{ marginTop: 10 }}>
                          {lines.map((r) => (
                            <div key={r.id} style={{ borderTop: "1px solid " + C.surface, padding: "10px 0" }}>
                              <div className="flex" style={{ gap: 7 }}>
                                <Field label="재료" w={2}><Txt value={r.m} list="mat-list" onChange={(v) => patchRec(r.id, { m: v })} /></Field>
                                <Field label="양"><Num value={r.amt} onChange={(v) => patchRec(r.id, { amt: v })} /></Field>
                              </div>
                              <div className="flex items-center" style={{ gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                                <Pill on={r.u === "g"} onClick={() => patchRec(r.id, { u: "g" })}>g</Pill>
                                <Pill on={r.u !== "g"} onClick={() => patchRec(r.id, { u: "개" })}>개</Pill>
                                <Pill on={!!r.inc} onClick={() => patchRec(r.id, { inc: r.inc ? 0 : 1 })}>중량 포함</Pill>
                                <div style={{ flex: 1 }} />
                                <GhostBtn danger onClick={() => setMaster({ ...master, rec: rec.filter((x) => x.id !== r.id) })}>삭제</GhostBtn>
                              </div>
                              <div style={{ fontSize: 11, color: C.butter, fontFamily: MONO, marginTop: 7 }}>
                                이번 {amtText(num(r.amt) * ((mult[p.n] && mult[p.n].period) || 0), r.u, suOf(r.m))}
                                <span style={{ color: C.quiet }}> · </span>
                                주 {amtText(num(r.amt) * ((mult[p.n] && mult[p.n].week) || 0), r.u, suOf(r.m))}
                              </div>
                            </div>
                          ))}
                          <div style={{ marginTop: 12 }}>
                            <GhostBtn onClick={() => setMaster({
                              ...master,
                              rec: [...rec, { id: "r" + Date.now(), p: p.n, m: "", amt: 0, u: "g", inc: 1 }],
                            })}>+ 재료 추가</GhostBtn>
                          </div>

                          <div style={{ marginTop: 16, paddingTop: 12, borderTop: "1px solid " + C.surface }}>
                            <Field label="제품 이름">
                              <Txt value={p.n} onChange={(v) => renameProd(p.n, v)} />
                            </Field>
                            {itemMsg && (
                              <div style={{ fontSize: 11.5, color: C.warn, marginTop: 7, lineHeight: 1.6 }}>{itemMsg}</div>
                            )}
                            <div className="flex" style={{ gap: 7, marginTop: 10, flexWrap: "wrap" }}>
                              <GhostBtn onClick={() => { setSetTabSub("prods"); setOpenRow("p:" + p.n); setItemMsg(""); }}>생산량·방식 고치기</GhostBtn>
                              <GhostBtn danger onClick={() => {
                                if (armed !== "delr:" + p.n) { setArmed("delr:" + p.n); return; }
                                removeProd(p.n); setArmed("");
                              }}>{armed === "delr:" + p.n ? "지웁니다 — 한 번 더" : "제품과 배합 함께 삭제"}</GhostBtn>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })}
                <div style={{ marginTop: 16 }}>
                  <GhostBtn onClick={() => {
                    const n = addProd();
                    setRecProd(n); setOpenRow("rec:" + n);
                  }}>+ 빈 배합 만들기</GhostBtn>
                  <div style={{ fontSize: 11, color: C.quiet, marginTop: 7, lineHeight: 1.6 }}>
                    제품을 새로 만들고 배합을 처음부터 넣습니다.
                    적어둔 배합이 있으면 위쪽 '배합 붙여넣기'가 빠릅니다.
                  </div>
                </div>
                <div style={{ fontSize: 11, color: C.quiet, marginTop: 14, lineHeight: 1.6 }}>
                  '중량 포함'은 분할 g로 개수를 계산할 때 반죽 무게에 넣을지 여부입니다.
                  속재료·토핑처럼 반죽에 안 들어가는 건 꺼두세요.
                </div>
              </div>
            )}

            <div style={{ marginTop: 26, paddingTop: 16, borderTop: "1px solid " + C.line }}>
              <div style={sectionLabel}>새 매장 만들기</div>
              <div style={{ fontSize: 11.5, color: C.quiet, lineHeight: 1.65, marginBottom: 10 }}>
                단과자와 발효종만 남기고 나머지 제품·배합·품목을 전부 비웁니다.
                재고·발주 기록·차이 기록·달력에 적은 날짜별 kg·쉬는 날도 함께 지워집니다.
                요일 기본값과 발주 요일, 고정 휴무는 그대로 남습니다.
                다른 매장에 넘길 때 쓰세요. <b style={{ color: C.warn }}>이 폰의 지금 데이터가 지워지니</b>,
                먼저 아래 내보내기로 백업을 뜬 다음 누르세요.
              </div>
              <Field label="새 매장 이름">
                <Txt value={shellName} onChange={setShellName} />
              </Field>
              <div style={{ marginTop: 9 }}>
                <GhostBtn danger onClick={() => {
                  if (armed !== "shell") { setArmed("shell"); return; }
                  // 이전 매장의 기록이 따라가지 않게 전부 비웁니다
                  setDb((d) => ({
                    ...d,
                    master: makeShell(d.master, (shellName || "").trim() || "새 매장"),
                    stock: {}, pending: {}, exp: {}, expPrev: {}, diff: {},
                    expAt: "", filled: true, days: {}, off: {},
                  }));
                  setOpenRow(null); setFilter(""); setArmed("");
                }}>{armed === "shell" ? "정말 비웁니다 — 한 번 더" : "껍데기로 비우기"}</GhostBtn>
              </div>
            </div>

            <div style={{ marginTop: 22, paddingTop: 16, borderTop: "1px solid " + C.line }}>
              <GhostBtn danger onClick={() => {
                if (armed !== "reset") { setArmed("reset"); return; }
                setMaster(SEED); setArmed("");
              }}>{armed === "reset" ? "처음 상태로 되돌립니다 — 한 번 더" : "배합·품목 전체 초기화"}</GhostBtn>
              {armed === "reset" && (
                <div style={{ fontSize: 11, color: C.quiet, marginTop: 7 }}>재고와 요일별 kg은 그대로 둡니다.</div>
              )}
            </div>
          </div>
        )}

        {/* ── 설정 옮기기 ── */}
        <div id="state-move" style={{ marginTop: 32, paddingTop: 16, borderTop: "1px solid " + C.surface }}>
          <div style={sectionLabel}>설정 옮기기</div>
          <div className="flex" style={{ gap: 8 }}>
            <button onClick={copyState} style={{
              flex: 1, padding: "11px", borderRadius: 10, background: "transparent",
              color: stateCopied ? C.butter : C.muted, border: "1px solid " + (stateCopied ? C.butter : C.line),
              fontSize: 12.5, cursor: "pointer", fontFamily: FONT,
            }}>{outOpen ? "닫기" : "내보내기"}</button>
            <button onClick={() => { setPasteOpen(!pasteOpen); setPasteMsg(""); }} style={{
              flex: 1, padding: "11px", borderRadius: 10, background: "transparent",
              color: pasteOpen ? C.flour : C.muted, border: "1px solid " + C.line,
              fontSize: 12.5, cursor: "pointer", fontFamily: FONT,
            }}>{pasteOpen ? "닫기" : "불러오기"}</button>
          </div>
          {outOpen && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 11.5, color: stateCopied ? C.butter : C.warn, lineHeight: 1.6, marginBottom: 7 }}>
                {stateCopied
                  ? "복사했습니다. 카톡 '나에게 보내기'에 붙여넣으세요."
                  : "자동 복사가 막혔습니다. 아래 칸을 길게 눌러 전체 선택 후 복사하세요."}
              </div>
              <textarea readOnly value={stateJson}
                onFocus={(e) => e.target.select()}
                onClick={(e) => e.target.select()}
                style={{
                  width: "100%", minHeight: 110, background: C.surface, color: C.muted,
                  border: "1px solid " + C.line, borderRadius: 10, padding: 10,
                  fontFamily: MONO, fontSize: 11,
                }} />
              <div style={{ fontSize: 11, color: C.quiet, marginTop: 6 }}>
                글자 {stateJson.length.toLocaleString()}자 · 전부 붙여넣어야 복원됩니다
              </div>
            </div>
          )}

          {pasteOpen && (
            <div style={{ marginTop: 10 }}>
              <textarea value={pasteText} onChange={(e) => { setPasteText(e.target.value); setPasteMsg(""); }}
                placeholder="내보내기로 복사한 글자를 여기에 붙여넣으세요"
                style={{
                  width: "100%", minHeight: 90, background: C.surface, color: C.flour,
                  border: "1px solid " + C.line, borderRadius: 10, padding: 11, fontFamily: MONO, fontSize: 12.5,
                }} />
              <button onClick={loadState} disabled={!pasteText.trim()} style={{
                width: "100%", marginTop: 8, padding: "12px", borderRadius: 10, border: "none",
                background: pasteText.trim() ? C.butter : C.raised,
                color: pasteText.trim() ? C.ink : C.quiet,
                fontSize: 14, fontWeight: 700, cursor: pasteText.trim() ? "pointer" : "default", fontFamily: FONT,
              }}>불러오기</button>
              {pasteMsg && (
                <div style={{ marginTop: 8, fontSize: 12, color: pasteMsg === "불러왔습니다" ? C.butter : C.warn }}>{pasteMsg}</div>
              )}
            </div>
          )}
          <div style={{ marginTop: 12, fontSize: 11, color: C.quiet, lineHeight: 1.7 }}>
            재고 · 요일별 kg · 생산 계획 · 배합과 품목까지 전부 이 앱에 저장됩니다.
            내보내기 한 글자에도 전부 담기니, 가끔 카톡 '나에게'에 붙여두면 백업이 됩니다.
          </div>
        </div>

      </div>
    </div>
  );
}

function App() {
  return (
    <Boundary>
      <AppInner />
    </Boundary>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
